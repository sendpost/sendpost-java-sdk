                shouldOverflow: false
                overflowPoolName: ""
                ips:
                - id: 6
                  publicIp: 3.238.19.86
                  reverseDnsHostname: sp0006.mtaspb.email
                  type: 1
                  autoWarmupEnabled: false
                  state: 1
                  created: 1597511124804000
                created: 1597511124804000
              schema:
                items:
                  $ref: '#/components/schemas/IPPool'
                type: array
