  /account/subaccount/stat/{subaccount_id}:
    get:
      description: |
        Retrieve daily email statistics for a specific sub-account. Returns one record per day within the date range, perfect for charting trends and identifying patterns.

        **Metrics Per Day:**
        | Metric | Description |
        |--------|-------------|
        | `processed` | Emails submitted to SendPost |
        | `delivered` | Successfully delivered to recipient's mailbox |
        | `dropped` | Blocked before sending (suppressed, invalid, etc.) |
        | `hardBounced` | Permanent failures (invalid address, domain doesn't exist) |
        | `softBounced` | Temporary failures (mailbox full, server down) |
        | `opens` | Total email opens (includes multiple opens per recipient) |
        | `clicks` | Total link clicks |
        | `unsubscribed` | Recipients who unsubscribed |
        | `spams` | Emails marked as spam by recipients |

        **Key Rates to Calculate:**
        - Delivery Rate = `delivered / processed × 100`
        - Open Rate = `opens / delivered × 100`
        - Click Rate = `clicks / delivered × 100`
        - Bounce Rate = `(hardBounced + softBounced) / processed × 100`

        **Use Cases:**
        - Daily performance dashboard
        - Week-over-week trend analysis
        - Identifying delivery issues early
        - SLA monitoring and reporting

        **Note:** Maximum date range is 31 days. Both `from` and `to` dates are inclusive.
      parameters:
      - description: Start date for stats retrieval (inclusive). Format YYYY-MM-DD.
        explode: true
        in: query
        name: from
        required: true
        schema:
          example: 2024-01-01
          format: date
          type: string
        style: form
      - description: End date for stats retrieval (inclusive). Must be after `from`
          date with max 31 days range.
        explode: true
        in: query
        name: to
        required: true
        schema:
          example: 2024-01-31
          format: date
          type: string
        style: form
      - description: The unique ID of the sub-account to retrieve stats for.
        explode: false
        in: path
        name: subaccount_id
        required: true
        schema:
          example: 11
          format: int64
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Stat'
                type: array
          description: Successful response
      security:
      - accountAuth: []
      summary: List Stats
      tags:
      - Stats
      x-code-samples:
      - lang: python
        source: |
          import requests
          url = "https://api.sendpost.io/api/v1/subaccount/stat"
          params = {"from": "2020-03-12", "to": "2020-04-14"}
          headers = {
              "accept": "application/json",
              "X-SubAccount-ApiKey": "<subaccount_api_key>"
          }
          response = requests.get(url, headers=headers, params=params)
          print(response.json())
      x-accepts:
      - application/json
