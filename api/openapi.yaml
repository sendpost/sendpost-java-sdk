                  type: 1
                  autoWarmupEnabled: false
                  state: 1
                  created: 1597511124804000
                created: 1686304219037565000
              schema:
                $ref: '#/components/schemas/IPPool'
          description: Created IPPool details
        "403":
          description: "Forbidden, IPPool with the same name already exists"
      security:
      - accountAuth: []
      summary: Create IPPool
      tags:
      - IPPools
      x-content-type: application/json
      x-accepts:
      - application/json
