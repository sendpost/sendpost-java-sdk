  /account/subaccount/:
    get:
      description: |
        Retrieve all sub-accounts under your main account. Sub-accounts allow you to segment email sending for different applications, brands, or use cases.

        **Sub-Account Types:**
        | Type | Value | Description |
        |------|-------|-------------|
        | Default | `0` | Primary sub-account created with your account (cannot be deleted) |
        | Custom | `1` | Additional sub-accounts you create |

        **Each Sub-Account Has:**
        - Unique `X-SubAccount-ApiKey` for API authentication
        - Independent suppression list
        - Isolated email statistics
        - Own domain configurations
        - SMTP credentials (if enabled)

        **Use Cases:**
        - Separate transactional and marketing emails
        - Multi-tenant SaaS applications (one sub-account per customer)
        - Different brands or product lines
        - Development/staging/production environments

        **Note:** `isPlus` indicates SendX Plus customers with premium features.
      operationId: getAllSubAccounts
      parameters:
      - description: Number of records to return per request. Default 20.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          example: 10
          type: integer
        style: form
      - description: Number of initial records to skip for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          example: 0
          type: integer
        style: form
      - description: Case-insensitive search against sub-account names.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: Production
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubAccount'
                type: array
          description: List of sub-accounts.
        "401":
          description: Unauthorized. Invalid or missing API key.
      security:
      - accountAuth: []
      summary: List Sub-Accounts
      tags:
      - Sub-Account
      x-accepts:
      - application/json
    post:
      description: |
        Create a new sub-account to segment your email sending. Each sub-account gets its own API key, suppression list, and statistics.

        **What You Get:**
        - Unique `X-SubAccount-ApiKey` for authentication
        - Isolated email statistics
        - Separate suppression management
        - Independent domain configuration
        - Optional SMTP credentials

        **Naming Best Practices:**
        - Use descriptive names: `Transactional_Orders`, `Marketing_Newsletter`
        - Include environment: `Production_Alerts`, `Staging_Tests`
        - For multi-tenant: `Client_CompanyName`

        **Use Cases:**
        - New application or microservice needing email
        - Onboarding a new client in multi-tenant setup
        - Creating isolated testing environment
        - Separating email streams for analytics
      operationId: createSubAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubAccount'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccount'
          description: Sub-account created successfully with API key.
        "403":
          description: Forbidden. Sub-account with the same name already exists.
        "401":
          description: Unauthorized. Invalid or missing API key.
      security:
      - accountAuth: []
      summary: Create Sub-Account
      tags:
      - Sub-Account
      x-content-type: application/json
      x-accepts:
      - application/json
  /account/subaccount/{subaccount_id}:
    delete:
      description: |
        Remove a sub-account from your organization. This action is irreversible.

        **⚠️ Before Deleting:**
        - Export any needed statistics or suppression lists
        - Update applications using this sub-account's API key
        - Ensure no active email sending relies on this sub-account

        **What Gets Deleted:**
