      - application/json
    post:
      description: |
        Create a new IP pool to organize your sending infrastructure. Pools group IPs and third-party sending providers (TPSPs) for intelligent routing.

        **Pool Components:**
        - **IPs:** Dedicated IP addresses from your account
        - **TPSPs:** Third-party sending providers (SendGrid, Mailgun, etc.)

        **TPSP Types:**
        | Value | Provider |
        |-------|----------|
        | `0` | Amazon SES |
        | `1` | SendGrid |
        | `2` | Mailgun |
        | `3` | Custom SMTP |
        | `4` | PostMark |
        | `5` | Gmail |

        **Routing Strategies:**
        - `0` = Round Robin - Distribute traffic evenly
        - `1` = Email Provider - Route by recipient's mailbox provider
        - `2` = Volume Percentage - Split by defined percentages
        - `3` = Sending Domain - Route by your from domain

        **Use Cases:**
        - Separate transactional from marketing emails
        - Route high-volume traffic through TPSPs
        - Implement provider-specific routing for deliverability
        - Create backup pools for failover

        **Naming Best Practices:**
        - Use descriptive names: `Transactional_Orders`, `Marketing_Newsletter`
        - Include purpose: `HighPriority_Alerts`, `Bulk_Promotions`
      operationId: createIPPool
      requestBody:
        content:
          application/json:
            example:
              name: Marketing Promotional
              tpsps:
              - 1
              ips:
              - publicIP: 3.238.19.87
            schema:
              $ref: '#/components/schemas/IPPoolCreateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                id: 3
                name: Marketing Promotional
                type: 1
                routingStrategy: 0
                routingMetaData: "{}"
                shouldOverflow: false
                overflowPoolName: ""
                ips:
                - id: 6
