      x-accepts:
      - application/json
  /account/webhook:
    get:
      description: |
        Retrieve all configured webhooks for your account. Webhooks enable real-time notifications when email events occur, allowing you to build reactive applications.

        **Supported Events:**
        | Event | Description |
        |-------|-------------|
        | `processed` | Email accepted and queued for delivery |
        | `dropped` | Email blocked (suppressed, invalid, policy) |
        | `delivered` | Email successfully delivered to recipient |
        | `hardBounced` | Permanent delivery failure |
        | `softBounced` | Temporary delivery failure |
        | `opened` | Recipient opened the email (all opens) |
        | `uniqueOpened` | First open per recipient only |
        | `clicked` | Recipient clicked a link (all clicks) |
        | `uniqueClicked` | First click per recipient only |
        | `unsubscribed` | Recipient unsubscribed |
        | `spam` | Recipient marked email as spam |

        **Use Cases:**
        - Audit configured webhook endpoints
        - Verify webhook URLs are correct
        - Review enabled events per webhook
        - Debug webhook delivery issues
      operationId: getAllWebhooks
      parameters:
      - description: Number of records to return per request. Default 20.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          example: 10
          type: integer
        style: form
      - description: Number of initial records to skip for pagination.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          example: 0
          type: integer
        style: form
      - description: Case insensitive search against webhook URLs.
        explode: true
        in: query
        name: search
        required: false
        schema:
          example: api.yoursite.com
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountWebhookWithStats'
                type: array
          description: "List of configured webhooks, each with its delivery success\
            \ rate."
      security:
      - accountAuth: []
      summary: List Webhooks
      tags:
      - Webhook
      x-accepts:
      - application/json
    post:
      description: |
        Create a new webhook to receive real-time notifications for email events. Your endpoint will receive HTTP POST requests with event data as they occur.

        **Endpoint Requirements:**
        - Must be publicly accessible HTTPS URL
        - Should return 2xx status within 30 seconds
        - Handle potential duplicate events (use event ID for deduplication)
        - Implement retry/queue logic for reliability

        **Choosing Events:**
        - **Engagement Tracking:** `uniqueOpened`, `uniqueClicked` for metrics
        - **Full History:** `opened`, `clicked` for complete event logs
        - **Delivery Monitoring:** `delivered`, `hardBounced`, `softBounced`
        - **Compliance:** `unsubscribed`, `spam`

        **Best Practices:**
        - Only enable events you actually need
        - Store events before processing (async processing)
        - Implement idempotency using event IDs
        - Set up monitoring for webhook failures

        **Webhook Payload Example:**
        ```json
        {
          "eventId": "evt_123",
          "event": "delivered",
          "messageId": "msg_456",
          "recipient": "user@example.com",
          "timestamp": "2024-01-15T10:30:00Z"
        }
        ```
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewWebhook'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: Webhook created successfully.
        "401":
          description: Unauthorized. Invalid or missing API key.
        "403":
          description: Forbidden. Webhook with the same URL already exists.
        "406":
          description: Not Acceptable. Cannot create webhook for the default sub-account.
        "422":
          description: Unprocessable entity. Invalid URL or missing required fields.
      security:
      - accountAuth: []
      summary: Create Webhook
      tags:
      - Webhook
      x-content-type: application/json
      x-accepts:
      - application/json
  /account/webhook/{webhook_id}:
    delete:
      description: |
        Remove a webhook from your account. After deletion, no further events will be sent to that endpoint.

        **Before Deleting:**
        - Ensure your application doesn't rely on these events
        - Consider updating to a new webhook instead if you're migrating

        **Note:** Events that occurred before deletion are not affected. Historical data remains intact.
      operationId: deleteWebhook
      parameters:
      - description: The unique ID of the webhook to delete.
        explode: false
        in: path
        name: webhook_id
        required: true
        schema:
          example: 117
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWebhookResponse'
          description: Webhook deleted successfully.
      security:
      - accountAuth: []
      summary: Delete Webhook
      tags:
      - Webhook
      x-accepts:
      - application/json
    get:
      description: |
        Retrieve detailed information about a specific webhook, including its endpoint URL and enabled events.

        **Use Cases:**
        - Verify webhook configuration
        - Debug event delivery issues
        - Check enabled events for a webhook
        - Audit webhook settings
      operationId: getWebhook
      parameters:
      - description: The unique ID of the webhook to retrieve.
        explode: false
        in: path
        name: webhook_id
        required: true
        schema:
          example: 117
          type: integer
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: Webhook configuration details.
      security:
      - accountAuth: []
      summary: Get Webhook
      tags:
      - Webhook
      x-accepts:
      - application/json
    put:
      description: |
        Modify an existing webhook's configuration. Use this to change the endpoint URL or update which events trigger notifications.

        **What Can Be Updated:**
        - Webhook endpoint URL
        - Enabled/disabled events
        - Event-specific settings

        **Use Cases:**
        - Migrate to a new endpoint URL
        - Enable additional events as needs grow
        - Disable events to reduce traffic
        - Update after infrastructure changes
      operationId: updateWebhook
      parameters:
      - description: The unique ID of the webhook to update.
        explode: false
        in: path
        name: webhook_id
        required: true
        schema:
          example: 117
          type: integer
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhook'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
          description: Webhook updated successfully.
      security:
      - accountAuth: []
      summary: Update Webhook
      tags:
      - Webhook
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  schemas:
    EmailMessageObject:
      description: |
        Email message object containing all the details required to send an email.
        At minimum, you need to provide `from`, `to`, and either `subject` with `htmlBody`/`textBody` or a `template`.
      example:
        from:
          email: notifications@yourcompany.com
          name: Your Company
        replyTo:
          email: support@yourcompany.com
          name: Support Team
        to:
        - email: customer@example.com
          name: John Doe
          customFields:
            firstName: John
            orderId: ORD-12345
            orderTotal: $99.99
        subject: "Your order {{orderId}} has been shipped!"
        htmlBody: "<h1>Hi {{firstName}}</h1><p>Your order {{orderId}} worth {{orderTotal}}\
          \ is on its way!</p>"
        textBody: "Hi {{firstName}}, Your order {{orderId}} worth {{orderTotal}} is\
          \ on its way!"
        ippool: transactional
        trackOpens: true
        trackClicks: true
        groups:
        - order-shipped
        - transactional
      properties:
        from:
          $ref: '#/components/schemas/EmailAddress'
        replyTo:
          $ref: '#/components/schemas/EmailAddress'
        to:
          description: |
            List of recipients. Each recipient can have their own CC, BCC, and custom fields for personalization.
            Maximum 1000 recipients per API call.
          items:
            $ref: '#/components/schemas/Recipient'
          maxItems: 1000
          minItems: 1
          type: array
        subject:
          description: |
            Email subject line. Supports Handlebars templating for personalization.
            Example: "Hello, {{firstName}}! Your order is ready"
          example: "Welcome to SendPost, {{firstName}}!"
          maxLength: 998
          type: string
        preText:
          description: |
            Preview text (preheader) shown in email clients before opening the email.
            This text appears after the subject line in most email clients' inbox view.
          example: Your weekly digest is here with 5 new updates...
          maxLength: 200
          type: string
        htmlBody:
          description: |
            HTML content of the email. Supports Handlebars templating for personalization.
            Use {{customFieldName}} to insert recipient-specific values.
          example: "<html><body><h1>Hello {{firstName}}</h1><p>Welcome to our platform!</p></body></html>"
          type: string
        textBody:
          description: |
            Plain text content of the email. Used as fallback when HTML cannot be rendered.
            Also improves deliverability as some spam filters prefer multipart emails.
          example: |-
            Hello {{firstName}},

            Welcome to our platform!

            Best regards,
            The Team
          type: string
        ampBody:
          description: |
            AMP HTML content for supported email clients (Gmail, Yahoo).
            Enables interactive email experiences like carousels, forms, and real-time content.
            See https://amp.dev/about/email/ for more details.
          example: <!doctype html><html ⚡4email><head>...</head><body>...</body></html>
          type: string
        template:
          description: |
            Name of a pre-defined template to use for this email.
            When specified, the template's subject, htmlBody, and textBody will be used
            unless explicitly overridden in this request.
          example: welcome-email-v2
          type: string
        ippool:
          description: |
            Name of the IP pool to use for sending this email.
            If not specified, the default IP pool for the sub-account will be used.
          example: transactional
          type: string
        headers:
          additionalProperties:
            type: string
          description: |
            Custom email headers to include in the message.
            Common uses: adding List-Unsubscribe headers, custom tracking IDs, or priority flags.
            Note: Some headers like From, To, Subject are set automatically and cannot be overridden.
          example:
            X-Custom-Header: custom-value
            X-Campaign-ID: summer-sale-2024
            List-Unsubscribe: <mailto:unsubscribe@example.com>
        trackOpens:
          default: true
          description: |
            Whether to track email opens using a tracking pixel.
            When enabled, a 1x1 transparent image is inserted into the HTML body.
            Default: true (if not specified)
          example: true
          type: boolean
        trackClicks:
          default: true
          description: |
            Whether to track link clicks by rewriting URLs through SendPost's tracking domain.
            When enabled, all links in htmlBody are replaced with tracking URLs.
            Default: true (if not specified)
          example: true
          type: boolean
        groups:
          description: |
            Tags/groups to categorize this email for analytics and reporting.
            Use groups to segment your email statistics (e.g., by campaign, email type, or customer segment).
          example:
          - transactional
          - order-confirmation
          - premium-customers
          items:
            type: string
          type: array
        attachments:
          description: |
            File attachments to include with the email.
            Maximum total attachment size: 25MB.
            Supported formats: PDF, images, documents, etc.
          items:
            $ref: '#/components/schemas/Attachment'
          type: array
        webhookEndpoint:
          description: |
            Custom webhook URL to receive events for this specific email.
            Overrides the default webhook configured at the account level.
            Useful for per-email or per-customer webhook routing.
          example: https://your-app.com/webhooks/email-events
          format: uri
          type: string
      required:
      - from
      - to
    EmailMessageWithTemplate:
      allOf:
      - $ref: '#/components/schemas/EmailMessageObject'
      - properties:
          template:
            type: string
          templateId:
            description: Template ID for the email template
            type: string
          templateVariables:
            additionalProperties:
              type: string
            description: Key-Value pair of template variables
      example:
        ampBody: <!doctype html><html ⚡4email><head>...</head><body>...</body></html>
        template: template
        headers:
          X-Custom-Header: custom-value
          X-Campaign-ID: summer-sale-2024
          List-Unsubscribe: <mailto:unsubscribe@example.com>
        trackOpens: true
        attachments:
        - filename: monthly-report.pdf
          content: JVBERi0xLjQKJeLjz9MKMyAwIG9...
        - filename: monthly-report.pdf
          content: JVBERi0xLjQKJeLjz9MKMyAwIG9...
        subject: "Welcome to SendPost, {{firstName}}!"
        ippool: transactional
        preText: Your weekly digest is here with 5 new updates...
        groups:
        - transactional
        - order-confirmation
        - premium-customers
        textBody: |-
          Hello {{firstName}},

          Welcome to our platform!

          Best regards,
          The Team
        templateId: templateId
        templateVariables:
          key: templateVariables
        htmlBody: "<html><body><h1>Hello {{firstName}}</h1><p>Welcome to our platform!</p></body></html>"
        replyTo:
          email: sender@example.com
          name: John Doe
        from:
          email: sender@example.com
          name: John Doe
        to:
        - email: jane@example.com
          name: Jane Smith
          cc:
          - email: manager@example.com
            name: Manager
          customFields:
            firstName: Jane
            companyName: Acme Corp
        - email: jane@example.com
          name: Jane Smith
          cc:
          - email: manager@example.com
            name: Manager
          customFields:
            firstName: Jane
            companyName: Acme Corp
        - email: jane@example.com
          name: Jane Smith
          cc:
          - email: manager@example.com
            name: Manager
          customFields:
            firstName: Jane
            companyName: Acme Corp
        - email: jane@example.com
          name: Jane Smith
          cc:
          - email: manager@example.com
            name: Manager
