  /subaccount/suppression:
    delete:
      description: |
        Remove email addresses from your suppression list, allowing them to receive emails again.

        **⚠️ Important: Use with caution!** Re-enabling sending to previously suppressed addresses can harm your sender reputation if used incorrectly.

        **Valid Use Cases:**
        - User confirms their valid email was incorrectly bounced
        - Manual suppression was added by mistake
        - User explicitly requests re-subscription after unsubscribing
        - Testing/development addresses that were suppressed

        **Not Recommended:**
        - Bulk removing hard bounces without individual verification
        - Removing spam complaints (users rarely want to receive emails again)
        - Attempting to re-engage addresses that bounced

        **Best Practice:** Before removing a suppression, verify with the recipient that they want to receive emails and that their address is valid.
      operationId: deleteSuppression
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deleteSuppression_request'
